<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Thanh toán - Melanie Mira</title>

    <link rel="stylesheet" href="assets/css/bootstrap.min.css" />
    <link rel="stylesheet" href="assets/css/base.css" />
    <link rel="stylesheet" href="assets/css/layout.css" />
    <link rel="stylesheet" href="assets/css/components.css" />
    <link rel="stylesheet" href="assets/css/responsive.css" />
  </head>
  <body>
    <div class="top-bar">
      <div class="container">
        <span>Design your own vibes</span>
      </div>
    </div>

    <header class="main-header">
      <div class="container header-inner">
        <a href="index.html" class="brand">
          <img src="assets/img/logo/logo.jpg" alt="Melanie Mira" />
          <span>Melanie Mira</span>
        </a>

        <form class="search-box" autocomplete="off">
          <input type="text" placeholder="Tìm váy, áo, phụ kiện..." />
          <button type="button">Tìm kiếm</button>
        </form>

        <div class="header-actions">
          <div class="account-menu">
            <a class="account-toggle">Tài khoản</a>
            <div class="account-dropdown">
              <a href="login.html">Đăng nhập</a>
              <a href="register.html">Đăng ký</a>
            </div>
          </div>

          <a href="cart.html" class="cart-link">
            Giỏ hàng
            <span id="cartCount">0</span>
          </a>
        </div>
      </div>
    </header>

    <nav class="main-nav">
      <div class="container">
        <ul class="nav-list">
          <li><a href="index.html">Trang chủ</a></li>
          <li><a href="products.html">Sản phẩm</a></li>
          <li><a href="collections.html">Bộ sưu tập</a></li>
          <li><a href="about.html">Giới thiệu</a></li>
          <li><a href="contact.html">Liên hệ</a></li>
        </ul>
      </div>
    </nav>

    <!-- Checkout page -->
    <main class="checkout-page">
      <div class="container">
        <div class="checkout-layout">
          <!-- Left: shipping information -->
          <section class="checkout-left">
            <div class="checkout-title-row">
              <h2>SHIPPING ADDRESS</h2>
              <p>Already have an account? <a href="login.html">Log in</a></p>
            </div>

            <form id="checkoutForm">
              <div class="checkout-field">
                <input
                  type="text"
                  id="customerEmail"
                  placeholder="Email Address"
                />
                <span class="form-error" id="errCustomerEmail"></span>
              </div>

              <label class="checkout-checkbox">
                <input type="checkbox" checked />
                <span>Email me with news & offers</span>
              </label>

              <div class="checkout-field">
                <select id="customerCountry">
                  <option value="Vietnam">Vietnam</option>
                </select>
              </div>

              <div class="checkout-field">
                <input
                  type="text"
                  id="customerAddress"
                  placeholder="Street Address*"
                />
                <span class="form-error" id="errCustomerAddress"></span>
              </div>

              <div class="checkout-field">
                <input
                  type="text"
                  id="customerAddressMore"
                  placeholder="Apartment, suite, unit, building, floor, etc.*"
                />
              </div>

              <div class="checkout-two-cols">
                <div class="checkout-field">
                  <input
                    type="text"
                    id="customerFirstName"
                    placeholder="First Name*"
                  />
                  <span class="form-error" id="errCustomerName"></span>
                </div>

                <div class="checkout-field">
                  <input
                    type="text"
                    id="customerLastName"
                    placeholder="Last Name*"
                  />
                </div>
              </div>

              <div class="checkout-two-cols">
                <div class="checkout-field">
                  <input
                    type="text"
                    id="customerWard"
                    placeholder="Ward/Commune*"
                  />
                </div>

                <div class="checkout-field">
                  <input
                    type="text"
                    id="customerPostal"
                    placeholder="Postal Code"
                  />
                </div>
              </div>

              <div class="checkout-two-cols">
                <div class="checkout-field">
                  <select id="customerProvince">
                    <option value="">Please select State/Province.</option>
                    <option value="TP. Hồ Chí Minh">TP. Hồ Chí Minh</option>
                    <option value="Hà Nội">Hà Nội</option>
                    <option value="Đà Nẵng">Đà Nẵng</option>
                    <option value="Khác">Khác</option>
                  </select>
                </div>

                <div class="checkout-field">
                  <input
                    type="text"
                    id="customerPhone"
                    placeholder="Phone Number*"
                  />
                  <span class="form-error" id="errCustomerPhone"></span>
                </div>
              </div>

              <div class="checkout-field">
                <textarea id="orderNote" rows="3" placeholder="Note"></textarea>
              </div>

              <label class="checkout-checkbox">
                <input type="checkbox" checked />
                <span>My billing and shipping address are the same</span>
              </label>

              <div class="checkout-field">
                <select id="paymentMethod">
                  <option value="">Payment method</option>
                  <option value="Thanh toán khi nhận hàng">
                    Thanh toán khi nhận hàng
                  </option>
                  <option value="Chuyển khoản ngân hàng">
                    Chuyển khoản ngân hàng
                  </option>
                </select>
                <span class="form-error" id="errPaymentMethod"></span>
              </div>

              <button type="submit" class="checkout-submit-btn">
                PLACE ORDER
              </button>
            </form>
          </section>

          <!-- Right: order summary -->
          <aside class="checkout-right">
            <div class="checkout-summary" id="checkoutSummary"></div>

            <div class="checkout-discount">
              <h3>DISCOUNT</h3>

              <div class="checkout-discount-row">
                <input
                  type="text"
                  id="discountCode"
                  placeholder="Discount code"
                />
                <button type="button" id="btnApplyDiscount">
                  Apply Discount
                </button>
              </div>
            </div>

            <div class="checkout-money">
              <div class="checkout-money-row">
                <span>Subtotal</span>
                <strong id="checkoutSubtotal">0đ</strong>
              </div>

              <div class="checkout-money-row">
                <span>Shipping & Handling</span>
                <strong id="checkoutShipping">0đ</strong>
              </div>

              <div class="checkout-money-row checkout-total-row">
                <span>Order Total</span>
                <strong id="checkoutTotal">0đ</strong>
              </div>
            </div>
          </aside>
        </div>
      </div>
    </main>

    <footer class="main-footer">
      <div class="container">
        <div class="footer-bottom">
          <p>© 2026 Melanie Mira. All rights reserved.</p>
        </div>
      </div>
    </footer>

    <script src="assets/js/jquery-4.0.0.min.js"></script>
    <script src="assets/js/bootstrap.min.js"></script>
    <script src="assets/js/core/header.js"></script>
    <script src="assets/js/pages/checkout.js"></script>
  </body>
</html>
