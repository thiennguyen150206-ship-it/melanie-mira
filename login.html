<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Đăng nhập hoặc tạo tài khoản - Melanie Mira</title>

    <link rel="stylesheet" href="assets/css/bootstrap.min.css" />
    <link rel="stylesheet" href="assets/css/base.css" />
    <link rel="stylesheet" href="assets/css/components.css" />
    <link rel="stylesheet" href="assets/css/responsive.css" />
    <script defer src="assets/js/jquery-4.0.0.min.js"></script>
    <script defer src="assets/js/core/api.js"></script>
    <script defer src="assets/js/core/header.js"></script>
    <script defer src="assets/js/pages/auth.js"></script>
  </head>

  <body class="lang-vi auth-page-body">
    <main class="auth-simple-page">
      <div class="auth-simple-logo">
        <a href="index.html">
          <img src="assets/img/logo/logo.jpg" alt="Melanie Mira" />
        </a>
      </div>

      <section class="auth-simple-box">
        <h1>Đăng nhập</h1>
        <p>Đăng nhập hoặc tạo tài khoản</p>

        <div class="auth-social-row">
          <button
            type="button"
            class="auth-social-btn auth-google"
            id="btnGoogleLogin"
            aria-label="Đăng nhập bằng Google"
          >
            <svg class="google-icon" viewBox="0 0 48 48" aria-hidden="true">
              <path
                fill="#FFC107"
                d="M43.6 20.5H42V20H24v8h11.3C33.7 32.6 29.4 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.9 1.2 8 3.1l5.7-5.7C34.1 6.1 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.2-.1-2.3-.4-3.5z"
              />
              <path
                fill="#FF3D00"
                d="M6.3 14.7l6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.9 1.2 8 3.1l5.7-5.7C34.1 6.1 29.3 4 24 4 16.3 4 9.6 8.3 6.3 14.7z"
              />
              <path
                fill="#4CAF50"
                d="M24 44c5.2 0 10-2 13.5-5.3l-6.2-5.2C29.3 35.1 26.8 36 24 36c-5.4 0-9.9-3.4-11.4-8.2L6 32.9C9.3 39.5 16.1 44 24 44z"
              />
              <path
                fill="#1976D2"
                d="M43.6 20.5H42V20H24v8h11.3c-.8 2.3-2.3 4.2-4.1 5.5l6.2 5.2C36.9 39.2 44 34 44 24c0-1.2-.1-2.3-.4-3.5z"
              />
            </svg>
          </button>
        </div>

        <div class="auth-divider">
          <span></span>
          <p>hoặc</p>
          <span></span>
        </div>

        <form id="authForm">
          <div class="auth-email-box">
            <input type="email" id="authEmail" placeholder="Email" />
            <button type="submit">→</button>
          </div>

          <span class="form-error" id="errAuthEmail"></span>

          <label class="auth-check-row">
            <input type="checkbox" id="authReceiveNews" />
            <span>
              Tôi đồng ý nhận thông tin, khuyến mãi từ Melanie Mira qua
              Email/Zalo.
            </span>
          </label>

          <p class="auth-note">
            Bằng cách tiếp tục, bạn đồng ý với
            <a href="#">Điều khoản dịch vụ</a>
          </p>
        </form>
      </section>

      <a href="#" class="auth-privacy">Chính sách quyền riêng tư</a>
    </main>
  </body>
</html>
