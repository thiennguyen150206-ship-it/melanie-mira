<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Đăng nhập hoặc tạo tài khoản - Melanie Mira</title>

    <link rel="stylesheet" href="assets/css/bootstrap.min.css" />
    <link rel="stylesheet" href="assets/css/base.css" />
    <link rel="stylesheet" href="assets/css/components.css" />
    <link rel="stylesheet" href="assets/css/responsive.css" />
    <script defer src="assets/js/jquery-4.0.0.min.js"></script>
    <script defer src="assets/js/core/api.js"></script>
    <script defer src="assets/js/core/header.js"></script>
  </head>

  <body class="lang-vi">
    <main class="auth-simple-page">
      <div class="auth-simple-logo">
        <a href="index.html">
          <img src="assets/img/logo/logo.jpg" alt="Melanie Mira" />
        </a>
      </div>

      <section class="auth-simple-box">
        <h1>Đăng nhập</h1>
        <p>Đăng nhập hoặc tạo tài khoản</p>

        <div class="auth-social-row">
          <button type="button" class="auth-social-btn auth-google">G</button>
          <button type="button" class="auth-social-btn auth-facebook">f</button>
        </div>

        <div class="auth-divider">
          <span></span>
          <p>hoặc</p>
          <span></span>
        </div>

        <form id="authForm">
          <div class="auth-email-box">
            <input type="email" id="authEmail" placeholder="Email" />
            <button type="submit">→</button>
          </div>

          <span class="form-error" id="errAuthEmail"></span>

          <label class="auth-check-row">
            <input type="checkbox" id="authReceiveNews" />
            <span>
              Tôi đồng ý nhận thông tin, khuyến mãi từ Melanie Mira qua
              Email/Zalo.
            </span>
          </label>

          <p class="auth-note">
            Bằng cách tiếp tục, bạn đồng ý với
            <a href="#">Điều khoản dịch vụ</a> của chúng tôi
          </p>
        </form>
      </section>

      <a href="#" class="auth-privacy">Chính sách quyền riêng tư</a>
    </main>

    <script>
      $("#authForm").submit(function (e) {
        e.preventDefault();

        let email = $("#authEmail").val().trim();

        $("#errAuthEmail").text("");

        if (email === "") {
          $("#errAuthEmail").text("Vui lòng nhập email.");
          return;
        }

        if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
          $("#errAuthEmail").text("Email không hợp lệ.");
          return;
        }

        localStorage.setItem("customerEmail", email);

        alert("Tiếp tục đăng nhập hoặc tạo tài khoản thành công!");
        window.location.href = "index.html";
      });
    </script>
  </body>
</html>
