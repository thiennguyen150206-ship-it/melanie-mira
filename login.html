<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Log in or create an account - Melanie Mira</title>
    <meta name="robots" content="noindex, follow" />

    <link rel="stylesheet" href="assets/css/bootstrap.min.css" />
    <link rel="stylesheet" href="assets/css/base.css" />
    <link rel="stylesheet" href="assets/css/components.css" />
    <link rel="stylesheet" href="assets/css/responsive.css" />
    <script defer src="assets/js/jquery-4.0.0.min.js"></script>
    <script defer src="assets/js/core/config.js"></script>
    <script defer src="assets/js/core/api.js"></script>
    <script defer src="assets/js/pages/auth.js"></script>
    <link
    rel="icon"
    type="image/png"
    href="assets/img/logo/favicon.png"
  />
</head>

  <body class="lang-en auth-page-body">
    <main class="auth-simple-page">
      <div class="auth-simple-logo">
        <a href="index.html">
          <img src="assets/img/logo/logo.jpg" alt="Melanie Mira" />
        </a>
      </div>

      <section class="auth-simple-box">
        <h1 id="authTitle">Log in</h1>
        <p id="authSubtitle">Log in or create an account</p>

        <div class="auth-social-row">
          <button
            type="button"
            class="auth-social-btn auth-google"
            id="btnGoogleLogin"
            aria-label="Log in with Google"
          >
            <svg class="google-icon" viewBox="0 0 48 48" aria-hidden="true">
              <path
                fill="#FFC107"
                d="M43.6 20.5H42V20H24v8h11.3C33.7 32.6 29.4 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.9 1.2 8 3.1l5.7-5.7C34.1 6.1 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.2-.1-2.3-.4-3.5z"
              />
              <path
                fill="#FF3D00"
                d="M6.3 14.7l6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.9 1.2 8 3.1l5.7-5.7C34.1 6.1 29.3 4 24 4 16.3 4 9.6 8.3 6.3 14.7z"
              />
              <path
                fill="#4CAF50"
                d="M24 44c5.2 0 10-2 13.5-5.3l-6.2-5.2C29.3 35.1 26.8 36 24 36c-5.4 0-9.9-3.4-11.4-8.2L6 32.9C9.3 39.5 16.1 44 24 44z"
              />
              <path
                fill="#1976D2"
                d="M43.6 20.5H42V20H24v8h11.3c-.8 2.3-2.3 4.2-4.1 5.5l6.2 5.2C36.9 39.2 44 34 44 24c0-1.2-.1-2.3-.4-3.5z"
              />
            </svg>
          </button>
        </div>

        <form id="authForm">
          <label class="auth-check-row">
            <input type="checkbox" id="authReceiveNews" />
            <span id="authReceiveNewsText">
              I agree to receive information and promotions from Melanie Mira
              via Email/Zalo.
            </span>
          </label>
        </form>
      </section>

      <div class="auth-footer-link">
        <a href="#" class="auth-privacy" id="authPrivacyText">
          Chính sách bảo mật
        </a>
      </div>
    </main>
  </body>
</html>
